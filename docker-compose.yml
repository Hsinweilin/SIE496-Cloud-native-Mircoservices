version: "3.8"  # Required for ECS compatibility

x-aws-ecs:
  execution_role: arn:aws:iam::339712796116:role/ECSFargateTaskExecutionRole

services:
  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "pass"
  configserver:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/configserver
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"

  eurekaserver:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/eurekaserver
    ports:
      - "8070:8070"
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"

  gatewayserver:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/gatewayserver
    environment:
      PROFILE: "default"
      SERVER_PORT: "8072"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      EUREKASERVER_URI: "http://eurekaserver:8070/eureka/"
      EUREKASERVER_PORT: "8070"
      CONFIGSERVER_PORT: "8089"

  inventory-order-service:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/inventory-order-service
    environment:
      SPRING_APPLICATION_NAME: "inventory-order-service"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"

  payment-service:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/payment-service
    environment:
      SPRING_APPLICATION_NAME: "payment-service"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"

  review-service:
    image: 339712796116.dkr.ecr.us-east-1.amazonaws.com/sie496/review-service
    ports:
      - "8080"
    environment:
      SPRING_APPLICATION_NAME: "review-service"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"

  redisserver:
    image: redis:alpine
    ports:
      - "6379:6379"

  kafkaserver:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafkaserver
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: dresses:1:1,ratings:1:1

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev

  zipkin:
    image: openzipkin/zipkin 
    ports:
      - "9411:9411"
